name: OpenAPI Lint

on:
  pull_request:
    paths:
      - 'openapi/**'
      - '.spectral.yaml'
      - '.github/workflows/openapi-lint.yml'
  push:
    branches: [ main, master ]
    paths:
      - 'openapi/**'
      - '.spectral.yaml'

jobs:
  spectral:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint OpenAPI
        run: npx --yes @stoplight/spectral-cli lint openapi/openapi.yaml -r .spectral.yaml
